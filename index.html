<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心霊図鑑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<title>日本心霊スポット図鑑 v6 OpenStreetMap版</title>
<style>
:root{--bg:#050505;--panel:#101010;--panel2:#161313;--line:#3a2220;--red:#e12c20;--red2:#7a0e09;--text:#f2ece8;--muted:#a99e98;--green:#4fb668;--amber:#db922a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{background:
radial-gradient(circle at 50% -12%,#2a0907 0,#0a0808 28%,#050505 65%),
repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 4px)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 35%,transparent 0 35%,#0008 72%,#000 100%);z-index:1000}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px;position:relative;z-index:1}
header{padding:20px 16px 10px;position:sticky;top:0;z-index:50;background:linear-gradient(#080808f5,#080808e5);backdrop-filter:blur(14px);border-bottom:1px solid #371c19}
.brand{font-family:serif;font-size:29px;letter-spacing:.08em;text-shadow:0 0 18px #8a0e08,0 0 2px #fff}
.sub{font-size:12px;color:#b4aaa5;margin-top:5px}.version{color:#e65348}
.search{margin-top:14px;display:flex;gap:8px}
.search input,.filters select,.memo textarea{width:100%;background:#151414;color:#fff;border:1px solid #3d2c29;border-radius:13px;padding:12px;font-size:16px}
.chips{display:flex;gap:8px;overflow:auto;padding:11px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #423533;background:#101010;color:#ddd;padding:8px 12px;border-radius:20px;font-size:13px}.chip.on{border-color:#a82017;color:#fff;background:#2b0c09;box-shadow:0 0 12px #8c0d0844}
.topstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px}
.stat{background:#101010;border:1px solid #382625;border-radius:13px;padding:10px;text-align:center}.stat span{font-size:12px;color:#a99f9a}.stat b{display:block;font-size:22px;margin-top:3px}
.hero{margin:0 16px 12px;border:1px solid #3a201e;border-radius:17px;overflow:hidden;background:#080808}
.map{height:330px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 44%,#17201e 0,#0c1110 36%,#080909 67%,#040404 100%)}
.map:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,#13201d33,transparent 62%);pointer-events:none}
.map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0 44%,#0008 78%,#000 100%);pointer-events:none}
.mapLabel{position:absolute;left:12px;top:12px;z-index:9;background:#080808d9;border:1px solid #542824;border-radius:11px;padding:8px 10px;font-size:12px}
.mapControls{position:absolute;right:12px;top:12px;z-index:10;display:grid;gap:8px}
.mapBtn{border:1px solid #6b2b25;background:#0d0d0ddd;color:#fff;border-radius:12px;padding:9px 10px;font-size:12px}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:#ee3125;border:2px solid #ffd7d3;box-shadow:0 0 8px #ff2b1d,0 0 18px #a30d08;transform:translate(-50%,-50%);z-index:5;border:none}
.pin:after{content:"";position:absolute;left:5px;top:10px;width:2px;height:8px;background:#e43127}
.you-pin{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:#e42e23;box-shadow:0 0 0 7px #e42e2333,0 0 14px #fff8;transform:translate(-50%,-50%);z-index:8}
.mapOverlay{padding:10px 12px;font-size:12px;color:#c4bab4;border-top:1px solid #2d1c1b}
.warning{margin:12px 16px;padding:12px;border-left:4px solid #b3231a;background:#1b0c0b;color:#ead7d1;font-size:13px;line-height:1.55}
.section{padding:4px 16px 14px}.section h2{font-size:19px;font-family:serif;margin:12px 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards{display:grid;gap:10px}
.card{background:linear-gradient(180deg,#141313,#0c0c0c);border:1px solid #392624;border-radius:15px;padding:12px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,#7e0d0711,transparent);pointer-events:none}
.row{display:flex;justify-content:space-between;gap:10px}.title{font-size:17px;font-family:serif}.meta{font-size:12px;color:var(--muted);margin-top:4px}
.desc{font-size:13px;color:#d0c8c3;line-height:1.65;margin:10px 0}
.badge{display:inline-block;border:1px solid #75241e;color:#ff6a60;border-radius:6px;padding:4px 7px;font-size:11px}.badge.green{border-color:#28653a;color:#6ddd82}.badge.amber{border-color:#795015;color:#e9ad58}
.danger{color:#e63d31;letter-spacing:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid #4a3030;background:#151414;color:#eee;border-radius:11px;padding:10px;font-size:14px}.btn.on{background:#65130e;border-color:#a72b21}.btn.visit.on{background:#123e20;border-color:#2d7f45}
.empty{padding:24px;text-align:center;color:#9d918b;border:1px dashed #3a2c28;border-radius:12px}
.detail{display:none;padding:0 16px 22px}.detail.show{display:block}
.detailHero{height:250px;border-radius:17px;background:radial-gradient(circle at 48% 42%,#1c2d28,#0a0c0b 50%,#040404);border:1px solid #3d2320;display:flex;align-items:center;justify-content:center;font-size:68px;position:relative;overflow:hidden}
.detailHero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,#ffffff05 10% 11%,transparent 12% 19%)}
.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#040404da)}
.detailHero span{z-index:1;filter:drop-shadow(0 0 18px #a20e08)}.detail h1{font-family:serif;font-size:28px;margin:14px 0 4px}
.memo textarea{min-height:100px;margin-top:8px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph{aspect-ratio:1.2;border:1px solid #392624;border-radius:11px;background:radial-gradient(circle at 30% 30%,#1e2924,#0a0b0a 50%,#050505);display:flex;align-items:center;justify-content:center;font-size:28px;filter:grayscale(.4)}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.infoBox{background:#101010;border:1px solid #30201f;border-radius:12px;padding:10px}.infoBox b{display:block;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#090909ee;border-top:1px solid #382523;backdrop-filter:blur(14px)}
.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:#8f8782;padding:10px 2px;font-size:11px}nav button.active{color:#ef3b2e}.icon{display:block;font-size:20px;margin-bottom:2px}
.settingsBox{background:#101010;border:1px solid #342221;border-radius:14px;padding:13px;margin-bottom:10px}
.settingsBox h3{margin:0 0 8px;font-family:serif}.ghostflash{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;background:radial-gradient(circle,#ffffff18,#7a000022 35%,#0000 70%)}
.ghostflash.on{animation:flash .45s ease}@keyframes flash{0%{opacity:0}45%{opacity:.9}100%{opacity:0}}
@media(max-width:420px){.brand{font-size:24px}.map{height:300px}.filters,.infoGrid{grid-template-columns:1fr}}

.jpmap-svg{position:absolute;inset:18px 28px 22px 28px;width:calc(100% - 56px);height:calc(100% - 40px);z-index:1;filter:drop-shadow(0 0 8px #6d130f88)}
.jp-land{fill:#272b29;stroke:#8b8f8a;stroke-width:1.25}
.jp-outline-glow{fill:none;stroke:#b8271e55;stroke-width:4}
.pin,.you-pin{z-index:6}
.routeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.routeCard{background:#101010;border:1px solid #3b2926;border-radius:12px;padding:10px;text-align:center}
.routeCard b{display:block;font-size:14px;margin:4px 0}.routeCard span{font-size:12px;color:#aaa09a}
.routeBtn{width:100%;margin-top:7px;border:1px solid #7f271f;background:#24100e;color:#ffddd8;border-radius:9px;padding:8px 4px;font-size:12px}
.photoControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.photoBtn{display:block;text-align:center;border:1px solid #6e2923;background:#21100f;color:#fff;border-radius:11px;padding:11px;font-size:14px}
.photoBtn input{display:none}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photoItem{position:relative;aspect-ratio:1/1;border:1px solid #3d2926;border-radius:11px;overflow:hidden;background:#0c0c0c}
.photoItem img{width:100%;height:100%;object-fit:cover;display:block}
.photoDelete{position:absolute;right:5px;top:5px;border:1px solid #70221d;background:#0a0a0acc;color:#fff;border-radius:999px;width:28px;height:28px;font-size:14px}
.photoEmpty{grid-column:1/-1;padding:18px;text-align:center;border:1px dashed #3a2926;border-radius:11px;color:#998d87;font-size:13px}
@media(max-width:420px){.routeGrid{grid-template-columns:1fr}.photoGrid{grid-template-columns:repeat(2,1fr)}}


#map{height:360px;position:relative;background:#080b0a}
#osmMap{position:absolute;inset:0;z-index:1}
#mapFallback{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at center,#15201d,#080909 55%,#050505);color:#9f948e;font-size:13px;text-align:center;padding:30px}
.leaflet-container{background:#080808;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.leaflet-tile-pane{filter:grayscale(.55) brightness(.58) contrast(1.15) sepia(.12)}
.leaflet-control-zoom a{background:#111!important;color:#eee!important;border-color:#3d2926!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111;color:#eee}
.leaflet-popup-content{margin:11px 13px;line-height:1.45}
.horror-marker{width:17px;height:17px;border-radius:50% 50% 50% 0;background:#e63227;border:2px solid #ffd7d2;
 transform:rotate(-45deg);box-shadow:0 0 9px #ff3327,0 0 17px #9b0c08}
.horror-marker span{display:block;width:5px;height:5px;border-radius:50%;background:#fff;margin:4px;transform:rotate(45deg)}
.user-marker{width:18px;height:18px;border-radius:50%;background:#2e8cff;border:3px solid #fff;
 box-shadow:0 0 0 7px #2e8cff44,0 0 14px #fff8}
.mapTopControls{position:absolute;right:10px;top:10px;z-index:500;display:grid;gap:7px}
.mapTopControls .mapBtn{box-shadow:0 2px 8px #0008}

</style>
</head>
<body>
<div class="ghostflash" id="ghostflash"></div>
<div class="app">
<header>
  <div class="brand">日本心霊スポット図鑑</div>
  <div class="sub">全国47都道府県対応・怖くて実用的なフィールドガイド <span class="version">v6 OpenStreetMap版</span></div>
  <div class="search"><input id="q" placeholder="スポット名・都道府県・メモを検索"></div>
  <div class="chips" id="chips"></div>
</header>

<div id="homeView">
  <div class="topstats">
    <div class="stat"><span>掲載</span><b id="spotCount">0</b></div>
    <div class="stat"><span>行きたい</span><b id="favCount">0</b></div>
    <div class="stat"><span>訪問済み</span><b id="visitCount">0</b></div>
  </div>

  <div class="hero">
    <div id="map" class="map">
      <div id="mapFallback">OpenStreetMapを読み込み中…<br>読み込めない場合も他の機能は利用できます。</div>
      <div id="osmMap" aria-label="OpenStreetMapによる日本全国の心霊スポット地図"></div>
      <div class="mapTopControls">
        <button class="mapBtn" id="locBtn">◎ 現在地</button>
        <button class="mapBtn" id="japanBtn">🗾 日本全体</button>
        <button class="mapBtn" id="randomBtn">☠ ランダム</button>
      </div>
    </div>
    <div class="mapOverlay">🗺️ OpenStreetMapを使用。赤いピンをタップするとスポット詳細を開けます。現在地を許可すると青い印で表示します。</div>
  </div>

  <div class="warning">⚠️ 私有地・閉鎖施設・線路・立入禁止区域には入らないでください。心霊情報は噂や体験談を含み、史実とは分けて楽しむ設計です。</div>

  <div class="section"><h2>現在地から近いスポット</h2><div id="nearby" class="cards"></div></div>
</div>

<div id="searchView" style="display:none">
  <div class="section">
    <h2 id="listTitle">全国データ検索</h2>
    <div class="filters">
      <select id="pref"></select>
      <select id="cat"></select>
    </div>
    <div class="cards" id="results" style="margin-top:10px"></div>
  </div>
</div>

<div id="detailView" class="detail">
  <button class="btn" id="backBtn">← 戻る</button>
  <div id="detailBody"></div>
</div>

<nav><div class="navin">
<button data-tab="home" class="active"><span class="icon">⌂</span>ホーム</button>
<button data-tab="search"><span class="icon">⌕</span>検索</button>
<button data-tab="fav"><span class="icon">♥</span>行きたい</button>
<button data-tab="visited"><span class="icon">✓</span>訪問済み</button>
<button data-tab="settings"><span class="icon">⚙</span>設定</button>
</div></nav>
</div>

<script>

 document.getElementById('backBtn').addEventListener('click',()=>showTab('search'));
 document.getElementById('locBtn').addEventListener('click',requestLocation);
 document.getElementById('japanBtn').addEventListener('click',()=>{if(osmMap)osmMap.fitBounds([[24,122],[46,146]],{padding:[12,12]});});
 document.getElementById('randomBtn').addEventListener('click',()=>{const x=filtered();if(x.length){openDetail(x[Math.floor(Math.random()*x.length)].id);flash();}});
 document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
 initOSM(); renderAll(); requestLocation();
}

function flash(){const f=document.getElementById('ghostflash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
function requestLocation(){
 if(!navigator.geolocation){alert('このブラウザでは位置情報を利用できません。');return;}
 navigator.geolocation.getCurrentPosition(pos=>{state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};renderAll();if(osmMap)osmMap.setView([state.loc.lat,state.loc.lng],10);},
 ()=>renderAll(),{enableHighAccuracy:false,timeout:8000});
}
function enrich(s){if(!state.loc)return {...s,d:null,t:null};const d=dist(state.loc.lat,state.loc.lng,s.lat,s.lng);return {...s,d,t:Math.max(5,Math.round(d/35*60))};}
function filtered(base=SPOTS){
 const q=document.getElementById('q').value.trim().toLowerCase();
 return base.filter(s=>{
   const memo=state.notes[s.id]||'';
   return (state.category==='すべて'||s.cat===state.category)&&(!q||(`${s.name} ${s.pref} ${s.cat} ${memo}`).toLowerCase().includes(q));
 });
}
function renderAll(){
 document.getElementById('spotCount').textContent=SPOTS.length;
 document.getElementById('favCount').textContent=state.fav.size;
 document.getElementById('visitCount').textContent=state.visited.size;
 renderMap();renderNearby();renderSearch();
}

function initOSM(){
 const fallback=document.getElementById('mapFallback');
 if(typeof L==='undefined'){
   fallback.innerHTML='OpenStreetMapを読み込めませんでした。<br>通信状態を確認してください。';
   return;
 }
 try{
   osmMap=L.map('osmMap',{zoomControl:true,minZoom:4,maxZoom:18,preferCanvas:true});
   L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
     maxZoom:19,
     attribution:'&copy; OpenStreetMap contributors'
   }).addTo(osmMap);
   spotLayer=L.layerGroup().addTo(osmMap);
   userLayer=L.layerGroup().addTo(osmMap);
   osmMap.fitBounds([[24,122],[46,146]],{padding:[8,8]});
   leafletReady=true;
   fallback.style.display='none';
   renderMap();
 }catch(err){
   console.error(err);
   fallback.innerHTML='地図の初期化に失敗しました。<br>他の機能はそのまま使えます。';
 }
}
function markerIcon(){
 return L.divIcon({
   className:'',
   html:'<div class="horror-marker"><span></span></div>',
   iconSize:[20,20],iconAnchor:[10,19],popupAnchor:[0,-16]
 });
}
function userIcon(){
 return L.divIcon({
   className:'',
   html:'<div class="user-marker"></div>',
   iconSize:[20,20],iconAnchor:[10,10]
 });
}
function renderMap(){
 if(!leafletReady||!osmMap||!spotLayer)return;
 spotLayer.clearLayers();
 filtered().forEach(s=>{
   const m=L.marker([s.lat,s.lng],{icon:markerIcon()}).addTo(spotLayer);
   m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.pref)}・${esc(s.cat)}<br><button type="button" data-open="${s.id}" style="margin-top:6px">詳細を見る</button>`);
   m.on('popupopen',e=>{
     const el=e.popup.getElement();
     const b=el&&el.querySelector(`[data-open="${s.id}"]`);
     if(b)b.addEventListener('click',()=>openDetail(s.id),{once:true});
   });
 });
 if(userLayer){
   userLayer.clearLayers();
   if(state.loc){
     L.marker([state.loc.lat,state.loc.lng],{icon:userIcon()}).addTo(userLayer).bindPopup('現在地');
   }
 }
}
function card(s){
 const e=enrich(s),skull='☠'.repeat(s.risk)+'·'.repeat(5-s.risk),memo=state.notes[s.id]||'';
 return `<article class="card">
 <div class="row"><div><div class="title">${esc(s.name)}</div><div class="meta">📍 ${esc(s.pref)} ・ ${esc(s.cat)}</div></div><span class="badge ${badgeClass(s.status)}">${esc(s.status)}</span></div>
 <div class="meta" style="margin-top:8px">${e.d==null?'現在地未取得':`${e.d.toFixed(1)}km ・ 🚗 約${travelInfo(s).drive} ・ 🚃 約${travelInfo(s).transit}`}</div>
 <div class="danger">${skull}</div><div class="desc">${esc(s.desc)}</div>
 ${memo?`<div class="meta">📝 ${esc(memo.slice(0,50))}${memo.length>50?'…':''}</div>`:''}
 <div class="actions"><button class="btn ${state.fav.has(s.id)?'on':''}" data-fav="${s.id}">♥ 行きたい</button><button class="btn visit ${state.visited.has(s.id)?'on':''}" data-visit="${s.id}">✓ 訪問済み</button></div>
 </article>`;
}
function bindActions(root){
 root.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.fav;state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();renderAll();}));
 root.querySelectorAll('[data-visit]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.visit;state.visited.has(id)?state.visited.delete(id):state.visited.add(id);save();renderAll();}));
 root.querySelectorAll('.card').forEach((el,i)=>{const ids=JSON.parse(root.dataset.ids||'[]');if(ids[i])el.addEventListener('click',e=>{if(!e.target.closest('button'))openDetail(ids[i]);});});
}
function renderNearby(){
 let xs=filtered().map(enrich);if(state.loc)xs.sort((a,b)=>a.d-b.d);xs=xs.slice(0,6);
 const el=document.getElementById('nearby');el.dataset.ids=JSON.stringify(xs.map(x=>x.id));el.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">該当スポットがありません</div>';bindActions(el);
}
function renderSearch(){
 let xs=filtered(),p=document.getElementById('pref').value,c=document.getElementById('cat').value;
 if(p)xs=xs.filter(x=>x.pref===p);if(c)xs=xs.filter(x=>x.cat===c);
 if(state.mode==='fav')xs=xs.filter(x=>state.fav.has(x.id));if(state.mode==='visited')xs=xs.filter(x=>state.visited.has(x.id));
 const el=document.getElementById('results');el.dataset.ids=JSON.stringify(xs.map(x=>x.id));el.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">この条件の掲載データはありません。</div>';bindActions(el);
}
function openDetail(id){
 const s=SPOTS.find(x=>x.id===id),e=enrich(s);showTab('detail');
 const note=state.notes[s.id]||'';
 document.getElementById('detailBody').innerHTML=`
 <div class="detailHero"><span>◉</span></div><h1>${esc(s.name)}</h1>
 <div class="meta">${esc(s.pref)} ・ ${esc(s.cat)}</div>
 <p><span class="badge ${badgeClass(s.status)}">${esc(s.status)}</span> <span class="danger">${'☠'.repeat(s.risk)}</span></p>
 <div class="infoGrid">
   <div class="infoBox"><b>現在地から</b>${e.d==null?'未取得':`${e.d.toFixed(1)}km`}</div>
   <div class="infoBox"><b>位置</b>${esc(s.pref)}</div>
 </div>
 <h2>現在地からの移動方法</h2>
 <div class="routeGrid">
   <div class="routeCard">🚗<b>車</b><span>${travelInfo(s).drive}</span><button class="routeBtn" data-route="drive">Appleマップでルート</button></div>
   <div class="routeCard">🚃<b>公共交通</b><span>${travelInfo(s).transit}</span><button class="routeBtn" data-route="transit">Appleマップでルート</button></div>
   <div class="routeCard">🚶<b>徒歩</b><span>${travelInfo(s).walk}</span><button class="routeBtn" data-route="walk">Appleマップでルート</button></div>
 </div>
 <p class="meta">※時間は直線距離からの概算です。実際の所要時間・経路はAppleマップで確認してください。</p>
 <h2>スポット概要</h2><p class="desc">${esc(s.desc)}</p>
 <h2>伝承・歴史</h2><p class="desc">${esc(s.history)}</p>
 <div class="actions"><button class="btn ${state.fav.has(s.id)?'on':''}" id="dfav">♥ 行きたい</button><button class="btn visit ${state.visited.has(s.id)?'on':''}" id="dvisit">✓ 訪問済み</button></div>
 <h2>自分用メモ</h2><div class="memo"><textarea id="memo" placeholder="感想・注意点・次回確認したいこと">${esc(note)}</textarea></div>
 <h2>現地写真</h2>
 <div class="photoControls">
   <label class="photoBtn">📷 写真を撮る<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
   <label class="photoBtn">🖼️ 写真を選ぶ<input id="libraryInput" type="file" accept="image/*" multiple></label>
 </div>
 <div id="photoGrid" class="photoGrid"><div class="photoEmpty">まだ写真はありません</div></div>
 <p class="meta">写真はこのiPhone内に保存されます。</p>
 <h2>アクセス・安全</h2><p class="desc">${esc(s.access)}</p>`;
 document.getElementById('dfav').onclick=()=>{state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();openDetail(id);renderAll();};
 document.getElementById('dvisit').onclick=()=>{state.visited.has(id)?state.visited.delete(id):state.visited.add(id);save();openDetail(id);renderAll();};
 document.getElementById('memo').addEventListener('input',e=>{state.notes[id]=e.target.value;save();});
 document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{window.location.href=appleRouteUrl(s,b.dataset.route);}));
 document.getElementById('cameraInput').addEventListener('change',async e=>{await addPhotos(id,[...e.target.files]);renderPhotos(id);e.target.value='';});
 document.getElementById('libraryInput').addEventListener('change',async e=>{await addPhotos(id,[...e.target.files]);renderPhotos(id);e.target.value='';});
 renderPhotos(id);
}

const photoDB=(()=>{
 let dbp;
 function db(){
  if(!dbp)dbp=new Promise((resolve,reject)=>{
   const r=indexedDB.open('shinreiPhotos',1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('photos')){const s=d.createObjectStore('photos',{keyPath:'key'});s.createIndex('spot','spot',{unique:false});}};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
  });
  return dbp;
 }
 return {
  async put(o){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async list(spot){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos');const r=t.objectStore('photos').index('spot').getAll(spot);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});},
  async del(key){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
 };
})();
async function resizeImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('画像変換に失敗'));},'image/jpeg',0.82);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません'));};img.src=url;
 });
}
async function addPhotos(spot,files){
 for(const file of files.slice(0,12)){
  if(!file.type.startsWith('image/'))continue;
  try{const blob=await resizeImage(file);await photoDB.put({key:spot+'_'+Date.now()+'_'+Math.random().toString(36).slice(2),spot,blob,created:Date.now()});}catch(e){console.error(e);}
 }
}
async function renderPhotos(spot){
 const grid=document.getElementById('photoGrid');if(!grid)return;
 const items=(await photoDB.list(spot)).sort((a,b)=>b.created-a.created);
 if(!items.length){grid.innerHTML='<div class="photoEmpty">まだ写真はありません。現地で撮った写真や過去の写真を追加できます。</div>';return;}
 grid.innerHTML='';
 for(const item of items){
  const box=document.createElement('div');box.className='photoItem';
  const img=document.createElement('img');const url=URL.createObjectURL(item.blob);img.src=url;img.alt='記録写真';img.onload=()=>URL.revokeObjectURL(url);
  const del=document.createElement('button');del.className='photoDelete';del.type='button';del.textContent='×';del.setAttribute('aria-label','写真を削除');
  del.addEventListener('click',async()=>{if(confirm('この写真を削除しますか？')){await photoDB.del(item.key);renderPhotos(spot);}});
  box.append(img,del);grid.appendChild(box);
 }
}

function showTab(tab){
 if(tab==='home'&&osmMap)setTimeout(()=>osmMap.invalidateSize(),100);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 document.getElementById('homeView').style.display=tab==='home'?'block':'none';
 document.getElementById('searchView').style.display=['search','fav','visited','settings'].includes(tab)?'block':'none';
 document.getElementById('detailView').classList.toggle('show',tab==='detail');
 if(tab==='fav'){state.mode='fav';document.getElementById('listTitle').textContent='行きたい';renderSearch();}
 else if(tab==='visited'){state.mode='visited';document.getElementById('listTitle').textContent='訪問済み';renderSearch();}
 else if(tab==='search'){state.mode='all';document.getElementById('listTitle').textContent='全国データ検索';renderSearch();}
 else if(tab==='settings'){
   state.mode='all';document.getElementById('listTitle').textContent='設定';
   document.getElementById('results').innerHTML=`<div class="settingsBox"><h3>データ保存</h3><p class="desc">行きたい・訪問済み・メモはこの端末のSafari内に保存されます。</p></div>
   <div class="settingsBox"><h3>ホーム画面に追加</h3><p class="desc">Safariの共有ボタン →「ホーム画面に追加」でアプリのように起動できます。</p></div>
   <div class="settingsBox"><h3>安全について</h3><p class="desc">立入禁止・私有地・鉄道施設への侵入はしないでください。掲載情報より現地の最新表示を優先してください。</p></div>`;
 }
}
init();
</script>
