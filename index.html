<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>日本心霊スポット図鑑</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#060606;--panel:#111;--panel2:#171717;--line:#332020;--red:#d8291d;--red2:#7d100b;--text:#f0ece8;--muted:#a69b96;--green:#3fa35a;--amber:#d18b2b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#250a08 0,#080808 28%,#050505 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 4px)}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}
header{padding:18px 16px 10px;position:sticky;top:0;z-index:50;background:linear-gradient(#080808ee,#080808d8);backdrop-filter:blur(12px);border-bottom:1px solid #2b1717}
.brand{font-family:serif;font-size:28px;letter-spacing:.08em;text-shadow:0 0 18px #7b0c08}
.sub{font-size:12px;color:#b4aaa5;margin-top:4px}.search{display:flex;gap:8px;margin-top:14px}.search input,.filters select,.memo textarea{width:100%;background:#171717;color:#fff;border:1px solid #332727;border-radius:12px;padding:12px;font-size:16px}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;border:1px solid #3a3330;background:#111;color:#ddd;padding:7px 11px;border-radius:18px;font-size:13px}.chip.on{border-color:#a82118;color:#fff;background:#2a0b09}
.hero{margin:0 16px 12px;border:1px solid #271919;border-radius:16px;overflow:hidden;background:#0b0b0b}.map{height:310px}.mapOverlay{padding:10px 12px;font-size:12px;color:#c2b8b2;background:#0b0b0b}
.section{padding:4px 16px 12px}.section h2{font-size:18px;font-family:serif;margin:10px 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards{display:grid;gap:10px}
.card{background:linear-gradient(180deg,#141414,#0d0d0d);border:1px solid #312323;border-radius:14px;padding:12px}.row{display:flex;justify-content:space-between;gap:10px}.title{font-size:17px;font-family:serif}.meta{font-size:12px;color:var(--muted);margin-top:4px}.desc{font-size:13px;color:#d0c8c3;line-height:1.6;margin:10px 0}
.badge{display:inline-block;border:1px solid #6d211b;color:#ff695f;border-radius:6px;padding:4px 7px;font-size:11px}.badge.green{border-color:#28653a;color:#69d27f}.badge.amber{border-color:#7b5119;color:#e6aa55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #3f2b2b;background:#151515;color:#eee;border-radius:10px;padding:10px;font-size:14px}.btn.on{background:#61120d;border-color:#9d2118}.btn.visit.on{background:#123e20;border-color:#2d7f45}
.danger{color:#e3362a;letter-spacing:2px}.note{font-size:12px;color:#998d86}.empty{padding:24px;text-align:center;color:#9d918b;border:1px dashed #3a2c28;border-radius:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#090909ee;border-top:1px solid #322222;backdrop-filter:blur(12px)}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:#8f8782;padding:10px 2px;font-size:11px}nav button.active{color:#ef3b2e}.icon{display:block;font-size:20px;margin-bottom:2px}
.topstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 16px}.stat{background:#111;border:1px solid #2d2020;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:#f4e8e3}
.detail{display:none;padding:0 16px 20px}.detail.show{display:block}.detailHero{height:230px;border-radius:16px;background:radial-gradient(circle at center,#1e2925,#080b0a 55%,#050505);border:1px solid #332222;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#050505c9)}.detailHero span{z-index:1;filter:drop-shadow(0 0 18px #8b0e09)}
.detail h1{font-family:serif;font-size:27px;margin:14px 0 4px}.memo textarea{min-height:90px;margin-top:8px}.warning{margin:12px 16px;padding:12px;border-left:4px solid #a82018;background:#190b0a;color:#e8d5cf;font-size:13px;line-height:1.5}
@media(max-width:420px){.map{height:270px}.brand{font-size:24px}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">日本心霊スポット図鑑</div>
  <div class="sub">全国47都道府県を検索対象にした、怖くて実用的なフィールドガイド</div>
  <div class="search"><input id="q" placeholder="スポット名・都道府県・メモを検索"></div>
  <div class="chips" id="chips"></div>
</header>

<div id="homeView">
  <div class="topstats">
    <div class="stat"><span class="note">掲載</span><b id="spotCount">0</b></div>
    <div class="stat"><span class="note">行きたい</span><b id="favCount">0</b></div>
    <div class="stat"><span class="note">訪問済み</span><b id="visitCount">0</b></div>
  </div>
  <div class="hero">
    <div id="map" class="map"></div>
    <div class="mapOverlay">📍 HTTPS環境では「現在地」を使い、近い順・直線距離・概算移動時間を表示します。</div>
  </div>
  <div class="warning">⚠️ 私有地・閉鎖施設・線路・立入禁止区域には入らないでください。アプリは侵入を促すルートを案内しません。</div>
  <div class="section"><h2>現在地から近いスポット</h2><div id="nearby" class="cards"></div></div>
</div>

<div id="searchView" style="display:none">
  <div class="section">
    <h2>全国データ検索</h2>
    <div class="filters">
      <select id="pref"></select>
      <select id="cat"></select>
    </div>
    <div class="cards" id="results" style="margin-top:10px"></div>
  </div>
</div>

<div id="detailView" class="detail">
  <button class="btn" id="backBtn">← 戻る</button>
  <div id="detailBody"></div>
</div>

<nav><div class="navin">
<button data-tab="home" class="active"><span class="icon">⌂</span>ホーム</button>
<button data-tab="search"><span class="icon">⌕</span>検索</button>
<button data-tab="fav"><span class="icon">♥</span>行きたい</button>
<button data-tab="visited"><span class="icon">✓</span>訪問済み</button>
<button data-tab="settings"><span class="icon">⚙</span>設定</button>
</div></nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PREFS = ["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"];
const SPOTS = [{"id": "s01", "name": "常紋トンネル周辺", "pref": "北海道", "cat": "トンネル", "lat": 43.776, "lng": 143.508, "status": "外観・周辺のみ", "risk": 4, "desc": "鉄道史と怪談で知られる地域。線路・鉄道施設には立ち入らないでください。"}, {"id": "s02", "name": "恐山", "pref": "青森県", "cat": "寺社・霊場", "lat": 41.326, "lng": 141.09, "status": "公開見学可", "risk": 3, "desc": "日本三大霊場の一つとして知られる場所。開山期間・参拝ルールに従ってください。"}, {"id": "s03", "name": "松尾鉱山跡周辺", "pref": "岩手県", "cat": "鉱山・廃墟", "lat": 39.965, "lng": 140.914, "status": "外観のみ", "risk": 4, "desc": "旧鉱山集落の遺構で知られるエリア。建物内部や封鎖区域には入らないでください。"}, {"id": "s04", "name": "八木山橋周辺", "pref": "宮城県", "cat": "橋・道路", "lat": 38.257, "lng": 140.83, "status": "公道から", "risk": 3, "desc": "怪談で名前が挙がることのある橋。交通の妨げにならないよう注意してください。"}, {"id": "s05", "name": "千秋公園周辺", "pref": "秋田県", "cat": "公園・史跡", "lat": 39.721, "lng": 140.124, "status": "公開見学可", "risk": 2, "desc": "久保田城跡の公園。夜間は足元や周辺利用者に十分配慮してください。"}, {"id": "s06", "name": "滝不動周辺", "pref": "山形県", "cat": "寺社・霊場", "lat": 38.25, "lng": 140.34, "status": "公開範囲のみ", "risk": 3, "desc": "地域の伝承が語られることのある場所。現地の案内と立入表示を優先してください。"}, {"id": "s07", "name": "旧三森トンネル周辺", "pref": "福島県", "cat": "トンネル", "lat": 37.39, "lng": 140.22, "status": "通行状況要確認", "risk": 4, "desc": "旧道・隧道として語られる場所。閉鎖・規制がある場合は絶対に進入しないでください。"}, {"id": "s08", "name": "袋田の滝周辺", "pref": "茨城県", "cat": "自然・滝", "lat": 36.768, "lng": 140.406, "status": "公開見学可", "risk": 2, "desc": "観光地として有名な滝周辺。遊歩道から外れず安全第一で見学してください。"}, {"id": "s09", "name": "華厳の滝周辺", "pref": "栃木県", "cat": "自然・滝", "lat": 36.738, "lng": 139.503, "status": "公開見学可", "risk": 3, "desc": "歴史的逸話でも知られる観光地。展望区域・遊歩道内で見学してください。"}, {"id": "s10", "name": "薗原ダム周辺", "pref": "群馬県", "cat": "ダム・湖", "lat": 36.652, "lng": 139.151, "status": "公道・公開部のみ", "risk": 3, "desc": "ダム周辺の怪談が語られることがあります。管理区域には入らないでください。"}, {"id": "s11", "name": "旧吹上トンネル周辺", "pref": "東京都", "cat": "トンネル", "lat": 35.805, "lng": 139.259, "status": "立入規制に従う", "risk": 5, "desc": "青梅方面の旧道トンネルとして有名。封鎖・立入禁止箇所への侵入はしないでください。"}, {"id": "s12", "name": "八王子城跡", "pref": "東京都", "cat": "城跡・史跡", "lat": 35.653, "lng": 139.255, "status": "公開見学可", "risk": 4, "desc": "戦国史の史跡として知られる場所。公開時間や登山道の案内に従ってください。"}, {"id": "s13", "name": "小坪トンネル周辺", "pref": "神奈川県", "cat": "トンネル", "lat": 35.295, "lng": 139.568, "status": "公道から", "risk": 4, "desc": "逗子・鎌倉周辺で怪談が語られることのある道路。駐停車や徒歩移動は交通安全を優先してください。"}, {"id": "s14", "name": "青木ヶ原樹海・遊歩道", "pref": "山梨県", "cat": "森林・自然", "lat": 35.475, "lng": 138.646, "status": "遊歩道のみ", "risk": 5, "desc": "富士山麓の森林。指定遊歩道から外れず、単独で無理な行動をしないでください。"}, {"id": "s15", "name": "旧天城トンネル", "pref": "静岡県", "cat": "トンネル", "lat": 34.825, "lng": 138.934, "status": "公開状況要確認", "risk": 3, "desc": "歴史ある石造トンネル。通行止め・工事情報がある場合は現地表示を優先してください。"}, {"id": "s16", "name": "深泥池", "pref": "京都府", "cat": "池・自然", "lat": 35.062, "lng": 135.768, "status": "公共エリアのみ", "risk": 3, "desc": "古くから伝承が語られる池。自然保護区域のルールに従ってください。"}, {"id": "s17", "name": "旧生駒トンネル周辺", "pref": "大阪府", "cat": "トンネル", "lat": 34.674, "lng": 135.651, "status": "鉄道施設立入禁止", "risk": 5, "desc": "旧鉄道トンネルにまつわる話で知られる地域。鉄道用地には入らないでください。"}, {"id": "s18", "name": "一庫ダム周辺", "pref": "兵庫県", "cat": "ダム・湖", "lat": 34.918, "lng": 135.414, "status": "公開部のみ", "risk": 3, "desc": "ダム周辺の噂が語られることがあります。管理区域・夜間閉鎖区域に注意してください。"}, {"id": "s19", "name": "暗峠周辺", "pref": "奈良県", "cat": "峠・道路", "lat": 34.664, "lng": 135.659, "status": "公道から", "risk": 3, "desc": "歴史ある峠道。非常に急な区間があるため、心霊目的に限らず交通安全を優先してください。"}, {"id": "s20", "name": "犬鳴峠周辺", "pref": "福岡県", "cat": "峠・道路", "lat": 33.683, "lng": 130.56, "status": "立入禁止区域あり", "risk": 5, "desc": "全国的に怪談で知られる峠周辺。旧道や封鎖箇所へ侵入しないでください。"}, {"id": "s21", "name": "七つ釜周辺", "pref": "佐賀県", "cat": "海岸・自然", "lat": 33.55, "lng": 129.872, "status": "公開見学可", "risk": 2, "desc": "玄界灘の景勝地。崖や波打ち際では安全柵・遊歩道を守ってください。"}, {"id": "s22", "name": "軍艦島（端島）", "pref": "長崎県", "cat": "産業遺産", "lat": 32.627, "lng": 129.739, "status": "公式ツアーのみ", "risk": 4, "desc": "世界遺産の島。上陸は許可されたツアー・見学区域に限られます。"}, {"id": "s23", "name": "阿蘇・草千里周辺", "pref": "熊本県", "cat": "自然・火山", "lat": 32.885, "lng": 131.052, "status": "公開見学可", "risk": 3, "desc": "火山地域。火山規制や気象情報を確認し、立入規制に従ってください。"}, {"id": "s24", "name": "別府・地獄地帯周辺", "pref": "大分県", "cat": "温泉・自然", "lat": 33.316, "lng": 131.472, "status": "公開見学可", "risk": 2, "desc": "温泉地として有名。立入禁止の噴気地帯には入らないでください。"}, {"id": "s25", "name": "青島周辺", "pref": "宮崎県", "cat": "島・自然", "lat": 31.802, "lng": 131.476, "status": "公開見学可", "risk": 2, "desc": "観光地として知られる島。夜間の海岸歩行は足元に注意してください。"}, {"id": "s26", "name": "開聞岳周辺", "pref": "鹿児島県", "cat": "山・自然", "lat": 31.18, "lng": 130.528, "status": "登山道のみ", "risk": 3, "desc": "薩摩富士として知られる山。登山道・天候・装備の確認を優先してください。"}, {"id": "s27", "name": "ひめゆりの塔周辺", "pref": "沖縄県", "cat": "史跡", "lat": 26.131, "lng": 127.69, "status": "公開見学可", "risk": 4, "desc": "戦争の記憶を伝える場所。慰霊の場として節度ある見学をしてください。"}];
const cats=[...new Set(SPOTS.map(x=>x.cat))];
const state={
 fav:new Set(JSON.parse(localStorage.getItem('shinreiFav')||'[]')),
 visited:new Set(JSON.parse(localStorage.getItem('shinreiVisited')||'[]')),
 notes:JSON.parse(localStorage.getItem('shinreiNotes')||'{}'),
 loc:null, category:'すべて', mode:'all'
};
const save=()=>{localStorage.setItem('shinreiFav',JSON.stringify([...state.fav]));localStorage.setItem('shinreiVisited',JSON.stringify([...state.visited]));localStorage.setItem('shinreiNotes',JSON.stringify(state.notes));};
const dist=(a,b,c,d)=>{const R=6371,rad=x=>x*Math.PI/180,dl=rad(d-b),dp=rad(c-a);const q=Math.sin(dp/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q));}
const badgeClass=s=>s.includes('公開')?'green':(s.includes('外観')||s.includes('公道')||s.includes('遊歩道')||s.includes('公式'))?'amber':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let map, markers=[];

function init(){
 document.getElementById('pref').innerHTML='<option value="">すべての都道府県</option>'+PREFS.map(p=>`<option>${p}</option>`).join('');
 document.getElementById('cat').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>`<option>${c}</option>`).join('');
 document.getElementById('chips').innerHTML=['すべて',...cats].map(c=>`<button class="chip ${c==='すべて'?'on':''}" data-cat="${c}">${c}</button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));renderAll();}));
 document.getElementById('q').addEventListener('input',renderAll);
 document.getElementById('pref').addEventListener('change',renderSearch);
 document.getElementById('cat').addEventListener('change',renderSearch);
 document.getElementById('backBtn').addEventListener('click',()=>showTab('search'));
 document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
 initMap(); requestLocation(); renderAll();
}
function initMap(){
 map=L.map('map',{zoomControl:false}).setView([36.2,138.2],5);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
}
function requestLocation(){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(pos=>{state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};map.setView([state.loc.lat,state.loc.lng],9);L.circleMarker([state.loc.lat,state.loc.lng],{radius:8,color:'#fff',fillColor:'#d8291d',fillOpacity:1}).addTo(map).bindPopup('現在地');renderAll();},()=>renderAll(),{enableHighAccuracy:false,timeout:7000});
}
function enrich(s){if(!state.loc)return {...s,d:null,t:null};const d=dist(state.loc.lat,state.loc.lng,s.lat,s.lng);return {...s,d,t:Math.max(5,Math.round(d/35*60))};}
function filtered(base=SPOTS){
 const q=document.getElementById('q').value.trim().toLowerCase();
 return base.filter(s=>{
   const memo=state.notes[s.id]||'';
   return (state.category==='すべて'||s.cat===state.category) && (!q||(`${s.name} ${s.pref} ${s.cat} ${memo}`).toLowerCase().includes(q)));
 });
}
function renderAll(){
 document.getElementById('spotCount').textContent=SPOTS.length;
 document.getElementById('favCount').textContent=state.fav.size;
 document.getElementById('visitCount').textContent=state.visited.size;
 renderMap(); renderNearby(); renderSearch();
}
function renderMap(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 filtered().forEach(s=>{const m=L.circleMarker([s.lat,s.lng],{radius:6,color:'#ff3b30',fillColor:'#b10f08',fillOpacity:.92}).addTo(map).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.pref)} / ${esc(s.cat)}`);m.on('click',()=>openDetail(s.id));markers.push(m);});
}
function card(s){
 const e=enrich(s); const skull='☠'.repeat(s.risk)+'·'.repeat(5-s.risk);
 return `<article class="card">
 <div class="row"><div><div class="title">${esc(s.name)}</div><div class="meta">📍 ${esc(s.pref)} ・ ${esc(s.cat)}</div></div><span class="badge ${badgeClass(s.status)}">${esc(s.status)}</span></div>
 <div class="meta" style="margin-top:8px">${e.d==null?'現在地未取得':`${e.d.toFixed(1)}km ・ 車で約${e.t}分`}</div>
 <div class="danger">${skull}</div><div class="desc">${esc(s.desc)}</div>
 <div class="actions"><button class="btn ${state.fav.has(s.id)?'on':''}" data-fav="${s.id}">♥ 行きたい</button><button class="btn visit ${state.visited.has(s.id)?'on':''}" data-visit="${s.id}">✓ 訪問済み</button></div>
 </article>`;
}
function bindActions(root){
 root.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.fav;state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();renderAll();}));
 root.querySelectorAll('[data-visit]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.visit;state.visited.has(id)?state.visited.delete(id):state.visited.add(id);save();renderAll();}));
 root.querySelectorAll('.card').forEach((el,i)=>{const list=root.dataset.ids?JSON.parse(root.dataset.ids):[];if(list[i])el.addEventListener('click',e=>{if(!e.target.closest('button'))openDetail(list[i]);});});
}
function renderNearby(){
 let xs=filtered().map(enrich); if(state.loc)xs.sort((a,b)=>a.d-b.d); xs=xs.slice(0,5);
 const el=document.getElementById('nearby');el.dataset.ids=JSON.stringify(xs.map(x=>x.id));el.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">該当スポットがありません</div>';bindActions(el);
}
function renderSearch(){
 let xs=filtered();
 const p=document.getElementById('pref').value,c=document.getElementById('cat').value;
 if(p)xs=xs.filter(x=>x.pref===p);if(c)xs=xs.filter(x=>x.cat===c);
 if(state.mode==='fav')xs=xs.filter(x=>state.fav.has(x.id));if(state.mode==='visited')xs=xs.filter(x=>state.visited.has(x.id));
 const el=document.getElementById('results');el.dataset.ids=JSON.stringify(xs.map(x=>x.id));el.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">この条件の掲載データはまだありません。</div>';bindActions(el);
}
function openDetail(id){
 const s=SPOTS.find(x=>x.id===id),e=enrich(s);showTab('detail');
 const note=state.notes[s.id]||'';
 document.getElementById('detailBody').innerHTML=`<div class="detailHero"><span>◉</span></div><h1>${esc(s.name)}</h1>
 <div class="meta">${esc(s.pref)} ・ ${esc(s.cat)}</div>
 <p><span class="badge ${badgeClass(s.status)}">${esc(s.status)}</span> <span class="danger">${'☠'.repeat(s.risk)}</span></p>
 <div class="meta">${e.d==null?'現在地未取得':`現在地から ${e.d.toFixed(1)}km ・ 車で約${e.t}分`}</div>
 <h2>スポット概要</h2><p class="desc">${esc(s.desc)}</p>
 <div class="actions"><button class="btn ${state.fav.has(s.id)?'on':''}" id="dfav">♥ 行きたい</button><button class="btn visit ${state.visited.has(s.id)?'on':''}" id="dvisit">✓ 訪問済み</button></div>
 <h2>自分用メモ</h2><div class="memo"><textarea id="memo" placeholder="感想、注意点、次回確認したいこと">${esc(note)}</textarea></div>
 <h2>アクセス</h2><p class="desc">地図上の位置は参考情報です。現地の道路標識・公開範囲・施設管理者の案内を優先してください。</p>`;
 document.getElementById('dfav').onclick=()=>{state.fav.has(id)?state.fav.delete(id):state.fav.add(id);save();openDetail(id);renderAll();};
 document.getElementById('dvisit').onclick=()=>{state.visited.has(id)?state.visited.delete(id):state.visited.add(id);save();openDetail(id);renderAll();};
 document.getElementById('memo').addEventListener('input',e=>{state.notes[id]=e.target.value;save();});
}
function showTab(tab){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 document.getElementById('homeView').style.display=tab==='home'?'block':'none';
 document.getElementById('searchView').style.display=['search','fav','visited','settings'].includes(tab)?'block':'none';
 document.getElementById('detailView').classList.toggle('show',tab==='detail');
 if(tab==='fav'){state.mode='fav';renderSearch()}else if(tab==='visited'){state.mode='visited';renderSearch()}else if(tab==='search'){state.mode='all';renderSearch()}else if(tab==='settings'){state.mode='all';document.getElementById('results').innerHTML='<div class="card"><div class="title">設定</div><p class="desc">データはこの端末のSafari内に保存されます。ホーム画面に追加するとアプリ風に使えます。</p></div>';}
 if(tab==='home')setTimeout(()=>map.invalidateSize(),100);
}
init();
</script>
</body>
</html>
